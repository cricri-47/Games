nds into the garden…","Ein Kaninchen hüpft in den Garten…","Un conejo entra saltando en el huerto…","Um coelho chega saltando à horta…","Un coniglio irrompe nell’orto…"],["Les salades ? Il renifle, les moustaches frémissent.","Lettuce? He sniffs, whiskers twitching.","Salat? Er schnuppert, die Schnurrhaare zucken.","¿Lechugas? Olfatea y mueve los bigotes.","Alfaces? Ele fareja, os bigodes tremem.","Insalate? Annusa, i baffi fremono."],["Voyons la rangée suivante…","Let’s try the next row…","Auf zur nächsten Reihe…","Veamos la siguiente fila…","Vamos à próxima fileira…","Vediamo la fila successiva…"],["Les radis ? Un petit coup de nez…","Radishes? A little sniff…","Radieschen? Ein kurzes Schnuppern…","¿Rábanos? Un pequeño olfateo…","Rabanetes? Uma cheiradinha…","Ravanelli? Una piccola annusata…"],["Et par ici ?","What about here?","Und hier?","¿Y por aquí?","E por aqui?","E qui?"],["Les carottes ! Voilà ce qu’il cherchait.","Carrots! Just what he was looking for.","Karotten! Genau die hat er gesucht.","¡Zanahorias! Justo lo que buscaba.","Cenouras! Era isso que ele procurava.","Carote! Proprio quello che cercava."],["Il creuse au bout de la rangée de carottes.","He digs at the end of the carrot row.","Er gräbt am Ende der Karottenreihe.","Cava al final de la fila de zanahorias.","Ele cava no fim da fileira de cenouras.","Scava in fondo alla fila di carote."],["Il se glisse dans le terrier… jusqu’au dernier pompon.","He slips into the burrow… fluffy tail and all.","Er schlüpft in den Bau… bis zum letzten Schwänzchen.","Se mete en la madriguera… hasta la colita.","Ele entra na toca… até sumir a caudinha.","Si infila nella tana… fino all’ultimo codino."],["Sous terre, le gourmand fait disparaître les carottes une à une.","Underground, he makes the carrots vanish one by one.","Unter der Erde verschwinden die Karotten eine nach der anderen.","Bajo tierra, hace desaparecer las zanahorias una a una.","Debaixo da terra, ele faz as cenouras sumirem uma a uma.","Sottoterra fa sparire le carote una dopo l’altra."],["Plus une carotte ! Les salades et les radis n’ont pas bougé.","No carrots left! The lettuce and radishes are untouched.","Keine Karotte mehr! Salat und Radieschen stehen noch.","¡No queda ninguna zanahoria! Lechugas y rábanos siguen intactos.","Nenhuma cenoura! Alfaces e rabanetes continuam intactos.","Niente più carote! Insalate e ravanelli sono intatti."],["Bouquet","Bouquet","Blumenstrauß","Ramo","Buquê","Mazzo"],["Chien du pré","Meadow puppy","Wiesenhund","Perrito del prado","Cão do prado","Cagnolino del prato"],["Lapin du potager","Garden rabbit","Gartenkaninchen","Conejo del huerto","Coelho da horta","Coniglio dell’orto"],["Bouquet 01 — fleurs inclinées","Bouquet 01 — leaning flowers","Strauß 01 — geneigte Blumen","Ramo 01 — flores inclinadas","Buquê 01 — flores inclinadas","Mazzo 01 — fiori inclinati"],["Bouquet 02 — tournesols","Bouquet 02 — sunflowers","Strauß 02 — Sonnenblumen","Ramo 02 — girasoles","Buquê 02 — girassóis","Mazzo 02 — girasoli"],["Bouquet 03 — roses","Bouquet 03 — roses","Strauß 03 — Rosen","Ramo 03 — rosas","Buquê 03 — rosas","Mazzo 03 — rose"],["Bouquet 04 — lys blancs et orange","Bouquet 04 — white and orange lilies","Strauß 04 — weiße und orange Lilien","Ramo 04 — lirios blancos y naranjas","Buquê 04 — lírios brancos e laranja","Mazzo 04 — gigli bianchi e arancioni"],["Bouquet 05 — compositions","Bouquet 05 — mixes","Strauß 05 — Mischungen","Ramo 05 — mezclas","Buquê 05 — misturas","Mazzo 05 — composizioni"],["Chien 01 — une trouvaille dans le pré","Puppy 01 — a meadow discovery","Hund 01 — ein Fund auf der Wiese","Perro 01 — un hallazgo en el prado","Cão 01 — uma descoberta no prado","Cane 01 — una scoperta nel prato"],["Chien 02 — le petit toon","Puppy 02 — cartoon pup","Hund 02 — der Cartoonwelpe","Perro 02 — cachorro animado","Cão 02 — filhote animado","Cane 02 — cucciolo cartoon"],["Chien 03 — le chiot de référence","Puppy 03 — the reference pup","Hund 03 — der Vorlagenwelpe","Perro 03 — el c  Cliquez ou touchez une cible.","Shooting game: UFOs score ten points, ducks zero. Click or tap a target.","Schießspiel: UFOs bringen zehn Punkte, Enten null. Ziel anklicken oder antippen.","Juego de tiro: los ovnis dan diez puntos y los patos cero. Haz clic o toca un objetivo.","Jogo de tiro: OVNIs valem dez pontos e patos zero. Clique ou toque num alvo.","Gioco di tiro: gli UFO valgono dieci punti e le anatre zero. Fai clic o tocca un bersaglio."],["Bouquet de sept fleurs roses, mauves et crème, animé par une brise légère.","Seven pink, purple and cream flowers swaying in a light breeze.","Sieben rosa, violette und cremefarbene Blumen in einer leichten Brise.","Siete flores rosas, violetas y crema movidas por una suave brisa.","Sete flores rosas, roxas e creme ao vento suave.","Sette fiori rosa, viola e crema mossi da una brezza leggera."],["Bouquet de sept tournesols au cœur sombre, qui ouvrent leurs pétales et suivent le soleil.","Seven dark-centred sunflowers opening their petals and following the sun.","Sieben Sonnenblumen mit dunkler Mitte öffnen ihre Blüten und folgen der Sonne.","Siete girasoles de centro oscuro abren los pétalos y siguen al sol.","Sete girassóis de centro escuro abrem as pétalas e seguem o sol.","Sette girasoli dal centro scuro aprono i petali e seguono il sole."],["Bouquet de roses à pétales en spirale, certaines vues de face, avec des épines sur les tiges.","Roses with spiral petals, some facing forward, with thorns on their stems.","Rosen mit spiralförmigen Blütenblättern, teils von vorne, mit Dornen an den Stielen.","Rosas con pétalos en espiral, algunas de frente, con espinas en los tallos.","Rosas com pétalas em espiral, algumas de frente, com espinhos nos caules.","Rose dai petali a spirale, alcune frontali, con spine sugli steli."],["Bouquet de lys blancs et orange à six pétales recourbés et longues étamines.","White and orange lilies with six curved petals and long stamens.","Weiße und orange Lilien mit sechs gebogenen Blütenblättern und langen Staubblättern.","Lirios blancos y naranjas con seis pétalos curvados y estambres largos.","Lírios brancos e laranja com seis pétalas curvas e estames longos.","Gigli bianchi e arancioni con sei petali ricurvi e lunghi stami."],["Composition de sept fleurs, roses, tournesols et lys selon les cases sélectionnées.","Seven flowers: mixed blooms, roses, sunflowers and lilies as selected.","Sieben Blumen: Blüten, Rosen, Sonnenblumen und Lilien nach Auswahl.","Siete flores: flores, rosas, girasoles y lirios según la selección.","Sete flores: flores, rosas, girassóis e lírios conforme a seleção.","Sette fiori: fiori, rose, girasoli e gigli secondo la selezione."],["Un chien aux oreilles tombantes arrive dans un pré et joue avec un ballon ou enterre un os.","A floppy-eared dog enters a meadow, plays with a ball or buries a bone.","Ein Hund mit Schlappohren kommt auf die Wiese, spielt mit einem Ball oder vergräbt einen Knochen.","Un perro de orejas caídas llega al prado y juega con una pelota o entierra un hueso.","Um cão de orelhas caídas chega ao prado e brinca com uma bola ou enterra um osso.","Un cane dalle orecchie pendenti arriva nel prato, gioca con una palla o sotterra un osso."],["Un petit chien cartoon aux grands yeux arrive dans un pré et joue avec un ballon ou enterre un os.","A big-eyed cartoon puppy enters a meadow, plays with a ball or buries a bone.","Ein Cartoonwelpe mit großen Augen spielt auf der Wiese mit einem Ball oder vergräbt einen Knochen.","Un cachorro animado de ojos grandes juega en el prado con una pelota o entierra un hueso.","Um cão animado de olhos grandes brinca no prado com uma bola ou enterra um osso.","Un cucciolo cartoon dagli occhi grandi gioca nel prato con una palla o sotterra un osso."],["Un chiot brun et caramel inspiré du dessin fourni arrive dans un pré et joue avec un ballon ou enterre un os.","A brown and caramel puppy enters a meadow, plays with a ball or buries a bone.","Ein braun-karamellfarbener Welpe spielt auf der Wiese mit einem Ball oder vergräbt einen Knochen.","Un cachorro marrón y caramelo juega en el prado con una pelota o entierra un hueso.","Um filhote marrom e caramelo brinca no prado com uma bola ou enterra um osso.","Un cucciolo marrone e caramello gioca nel prato con una palla o sotterra un osso."],["Potager cartoon : salades, radis et carottes en rangées verticales. Un lapin renifle les légumes puis les carottes disparaissent dans son terrier.","Cartoon garden with vertical rows of lettuce, radishes and carrots. A rabbit sniffs them, then the carrots vanish into its burrow.","Cartoongarten mit senkrechten Salat-, Radieschen- und Karottenreihen. Ein Kaninchen schnuppert, dann verschwinden die Karotten im Bau.","Huerto animado con filas verticales de lechugas, rábanos y zanahorias. Un conejo olfatea y las zanahorias desaparecen en su madriguera.","Horta animada com fileiras verticais de alfaces, rabanetes e cenouras. Um coelho fareja e as cenouras somem na toca.","Orto cartoon con file verticali di insalate, ravanelli e carote. Un coniglio annusa, poi le carote spariscono nella tana."],["Ouvrir le bouquet flottant","Float the bouquet","Schwebend: den Strauß","Abrir flotante: el ramo","Abrir flutuante: o buquê","Apri mobile: il mazzo"],["Afficher le bouquet flottant","Show the bouquet","Anzeigen: den Strauß","Mostrar el ramo","Mostrar o buquê","Mostra il mazzo"],["Ouvrir le chien flottant","Float the puppy","Schwebend: den Hund","Abrir flotante: el perro","Abrir flutuante: o cão","Apri mobile: il cane"],["Afficher le chien flottant","Show the puppy","Anzeigen: den Hund","Mostrar el perro","Mostrar o cão","Mostra il cane"],["Ouvrir le lapin flottant","Float the rabbit","Schwebend: das Kaninchen","Abrir flotante: el conejo","Abrir flutuante: o coelho","Apri mobile: il coniglio"],["Afficher le lapin flottant","Show the rabbit","Anzeigen: das Kaninchen","Mostrar el conejo","Mostrar o coelho","Mostra il coniglio"],["Ouvrir le potager flottant","Float the garden","Sc const table=new Map(catalogue.map(row=>[normalize(row[0]),row[index]]));
const escape=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const pattern=new RegExp('(?<![\\p{L}])(?:'+[...table.keys()].sort((a,b)=>b.length-a.length).map(escape).join('|')+')(?![\\p{L}])','gu');
const cache=new Map();
function casing(source,target){return /[a-zA-ZÀ-ÿ]/.test(source)&&source===source.toUpperCase()?target.toLocaleUpperCase(language):target;}
function t(value){
 if(typeof value!=='string'||language==='fr'||!value.trim())return value;
 if(cache.has(value))return cache.get(value);
 const key=normalize(value.trim());let result;
 if(table.has(key)){const lead=value.match(/^\s*/)[0],tail=value.match(/\s*$/)[0];result=lead+casing(value.trim(),table.get(key))+tail;}
 else{
  const normalized=normalize(value);let cursor=0;result='';
  for(const match of normalized.matchAll(pattern)){
   result+=value.slice(cursor,match.index)+casing(value.slice(match.index,match.index+match[0].length),table.get(match[0]));
   cursor=match.index+match[0].length;
  }
  result+=value.slice(cursor);
 }
 // Abréviations des anciens jeux : les vies restent identifiées par un cœur.
 result=result.replace(/\bV(\d+)/g,'♥$1').replace(/\bN(\d+)/g,'L$1');
